<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆小助 · 管理后台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2352c41a' width='32' height='32' rx='8'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/public/admin.css">
    <link rel="stylesheet" href="/public/extra.css">
</head>
<body>
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <div class="logo-text" style="margin-bottom:16px;">
                <div class="logo-icon">🌿</div>
                <span>豆小助</span>
            </div>
            <h1>登录管理后台</h1>
            <p>内部运营系统 · 账号密码登录</p>
            <div class="form-item">
                <label class="form-label">用户名</label>
                <input id="loginUser" class="form-input" value="admin" autocomplete="username">
            </div>
            <div class="form-item">
                <label class="form-label">密码</label>
                <input id="loginPass" type="password" class="form-input" value="admin123" autocomplete="current-password">
            </div>
            <div class="login-error" id="loginError"></div>
            <button class="btn btn-primary" style="width:100%;padding:10px;" onclick="doLogin()">登录</button>
            <div style="margin-top:12px;font-size:12px;color:#999;">默认管理员 admin / admin123 · 执行者请走小程序/H5</div>
        </div>
    </div>

    <div class="app-container" id="appRoot" style="display:none;">
        <div class="sidebar">
            <div class="logo">
                <div class="logo-text">
                    <div class="logo-icon">🌿</div>
                    <span>豆小助</span>
                    <span style="font-size:11px;color:#999;font-weight:400;margin-left:8px;">PC管理后台</span>
                </div>
            </div>
            <div class="nav-menu">
                <div class="nav-section">
                    <div class="nav-section-title">管理功能</div>
                    <div class="nav-item active" data-page="home"><div class="nav-icon">📊</div><span>数据看板</span></div>
                    <div class="nav-item" data-page="calendar"><div class="nav-icon">📅</div><span>任务日历</span></div>
                    <div class="nav-item" data-page="accounts"><div class="nav-icon">👤</div><span>全局账号</span><span class="nav-badge" id="badgeAccounts">0</span></div>
                    <div class="nav-item" data-page="tags"><div class="nav-icon">🏷️</div><span>人设库</span></div>
                    <div class="nav-item" data-page="ai"><div class="nav-icon">✨</div><span>AI创作</span></div>
                    <div class="nav-item" data-page="credentials"><div class="nav-icon">📋</div><span>审核凭证</span><span class="nav-badge" id="badgeCreds">0</span></div>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">系统</div>
                    <div class="nav-item" data-page="movies"><div class="nav-icon">🎬</div><span>电影管理</span></div>
                    <div class="nav-item" data-page="logs"><div class="nav-icon">📝</div><span>操作日志</span></div>
                    <div class="nav-item" data-page="analytics"><div class="nav-icon">📈</div><span>数据分析</span></div>
                    <div class="nav-item" data-page="settings"><div class="nav-icon">⚙️</div><span>系统设置</span></div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <div class="page-title" id="currentPageTitle">数据看板</div>
                <div class="top-actions">
                    <div class="user-menu">
                        <div class="user-avatar" id="userAvatar" onclick="toggleUserMenu()">管</div>
                        <div class="user-dropdown" id="userDropdown">
                            <div id="userMeta">—</div>
                            <div onclick="logout()">退出登录</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="content-area">
                <div class="page active" id="page-home"></div>
                <div class="page" id="page-calendar"></div>
                <div class="page" id="page-accounts"></div>
                <div class="page" id="page-tags"></div>
                <div class="page" id="page-ai"></div>
                <div class="page" id="page-credentials"></div>
                <div class="page" id="page-movies"></div>
                <div class="page" id="page-logs"></div>
                <div class="page" id="page-analytics"></div>
                <div class="page" id="page-settings"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalRoot"></div>
    <script src="/public/js/admin.js"></script>
</body>
</html>
